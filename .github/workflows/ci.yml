name: RetailMind CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: inventory_system
      DB_USER: root
      DB_PASSWORD: root
      RUN_DB_TESTS: 1
      WHITESPACE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install Python dependencies
        run: python -m pip install -r src/backend/legacy/demandForcasting/requirements.lock
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Import fresh schema
        run: mysql -h127.0.0.1 -uroot -proot inventory_system < src/backend/sql/schema.sql
      - name: Run migrations
        run: php src/backend/scripts/migrate.php
      - name: Run checks
        run: bash src/backend/tests/run_all.sh
