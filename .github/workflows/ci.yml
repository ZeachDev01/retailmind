name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production environment
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_HOST" || { echo 'Missing DB_HOST secret'; exit 1; }
          test -n "$DB_NAME" || { echo 'Missing DB_NAME secret'; exit 1; }
          test -n "$DB_USER" || { echo 'Missing DB_USER secret'; exit 1; }
          test -n "$DB_PASSWORD" || { echo 'Missing DB_PASSWORD secret'; exit 1; }
          umask 077
          printf '%s\n' \
            'APP_NAME=RetailMind' \
            'APP_ENV=production' \
            'APP_DEBUG=false' \
            'APP_URL=https://retailmind.infinityfreeapp.com' \
            'APP_TIMEZONE=Asia/Manila' \
            'SESSION_SECURE_COOKIE=true' \
            'DB_CONNECTION=mysql' \
            "DB_HOST=$DB_HOST" \
            'DB_PORT=3306' \
            "DB_NAME=$DB_NAME" \
            "DB_USER=$DB_USER" \
            "DB_PASSWORD=$DB_PASSWORD" \
            'DB_CHARSET=utf8mb4' > .env

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          server-dir: /htdocs/

      # The sync cache can skip .env even if it was removed from the server.
      - name: Upload production environment
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file .env "ftp://$FTP_SERVER/htdocs/.env"
