name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: srv2062.hstgr.io
      FTP_SERVER_DIR: ./
      FTP_USERNAME: ${{ secrets.HOSTINGER_DEMO_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.HOSTINGER_DEMO_FTP_PASSWORD }}
      APP_URL: https://antiquewhite-cattle-865506.hostingersite.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check demo deployment credentials
        run: |
          test -n "$FTP_USERNAME" || { echo 'Missing HOSTINGER_DEMO_FTP_USERNAME secret'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing HOSTINGER_DEMO_FTP_PASSWORD secret'; exit 1; }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, gd
          tools: composer:v2
          coverage: none

      - name: Build production release
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          bash scripts/build-infinityfree-release.sh
          python src/backend/tests/infinityfree_deploy_contract.py
          php src/backend/tests/hosted_database_config_test.php

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: .release/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          # Keep the manually configured Demo environment and runtime data.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            backend/
            backend/**
            **/storage/
            **/storage/**
            **/*.log

      - name: Verify hosted login and environment protection
        run: |
          curl --fail --silent --show-error --retry 3 "$APP_URL/?login=1" -o /tmp/retailmind-login.html
          grep -q 'id="landing-login-username"' /tmp/retailmind-login.html
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$APP_URL/.env")" = 403
