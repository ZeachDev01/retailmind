name: RetailMind CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: inventory_system
      DB_USER: root
      DB_PASSWORD: root
      RUN_DB_TESTS: 1
      WHITESPACE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, gd, fileinfo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install Python dependencies
        run: python -m pip install -r src/backend/legacy/demandForcasting/requirements.lock
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Import fresh schema
        run: mysql -h127.0.0.1 -uroot -proot inventory_system < src/backend/sql/schema.sql
      - name: Run migrations
        run: php src/backend/scripts/migrate.php
      - name: Run checks
        run: bash src/backend/tests/run_all.sh

  deploy:
    name: Deploy to InfinityFree
    if: github.event_name == 'push' && github.ref == 'refs/heads/1'
    runs-on: ubuntu-latest
    concurrency:
      group: infinityfree-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Check restricted-host startup
        run: php src/backend/tests/recovery_store_restricted_host_contract.php
      - name: Build deployment files
        run: bash scripts/build-infinityfree-release.sh
      - name: Check PHP syntax in deployment files
        run: find .release -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l > /dev/null
      - name: Check FTP configuration
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.INFINITYFREE_FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME" || { echo 'Missing INFINITYFREE_FTP_USERNAME secret'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing INFINITYFREE_FTP_PASSWORD secret'; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo 'Missing INFINITYFREE_FTP_SERVER_DIR variable'; exit 1; }
          [[ "$FTP_SERVER_DIR" == */htdocs/ ]] || { echo 'FTP server directory must end in /htdocs/'; exit 1; }
      - name: Upload over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./.release/
          server-dir: ${{ vars.INFINITYFREE_FTP_SERVER_DIR }}
          exclude: |
            .env
            **/.env
            **/storage/**
      # FTP-Deploy-Action compares against its saved sync state. If the host
      # removes an unchanged file, that state alone will not put it back.
      - name: Restore root entry and access rules
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.INFINITYFREE_FTP_SERVER_DIR }}
        run: |
          for file in index.php .htaccess; do
            curl --fail --show-error --silent --ssl-reqd --ftp-pasv \
              --retry 3 --retry-delay 2 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file ".release/$file" \
              "ftp://ftpupload.net${FTP_SERVER_DIR}${file}"
          done
