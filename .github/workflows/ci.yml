name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftpupload.net
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, gd
          tools: composer:v2
          coverage: none

      - name: Build production release
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          bash scripts/build-infinityfree-release.sh
          python src/backend/tests/infinityfree_deploy_contract.py

      - name: Create production environment
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$APP_URL" || { echo 'Missing APP_URL secret'; exit 1; }
          test -n "$DB_HOST" || { echo 'Missing DB_HOST secret'; exit 1; }
          test -n "$DB_NAME" || { echo 'Missing DB_NAME secret'; exit 1; }
          test -n "$DB_USER" || { echo 'Missing DB_USER secret'; exit 1; }
          test -n "$DB_PASSWORD" || { echo 'Missing DB_PASSWORD secret'; exit 1; }
          test -n "$FTP_USERNAME" || { echo 'Missing FTP_USERNAME secret'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing FTP_PASSWORD secret'; exit 1; }
          test "$FTP_USERNAME" = "$DB_USER" || { echo 'FTP_USERNAME and DB_USER must belong to the same InfinityFree account'; exit 1; }
          umask 077
          printf '%s\n' \
            'APP_NAME=RetailMind' \
            'APP_ENV=production' \
            'APP_DEBUG=false' \
            "APP_URL=$APP_URL" \
            'APP_TIMEZONE=Asia/Manila' \
            'SESSION_SECURE_COOKIE=true' \
            'DB_CONNECTION=mysql' \
            "DB_HOST=$DB_HOST" \
            'DB_PORT=3306' \
            "DB_NAME=$DB_NAME" \
            "DB_USER=$DB_USER" \
            "DB_PASSWORD=$DB_PASSWORD" \
            'DB_CHARSET=utf8mb4' > .env

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: .release/
          server-dir: /htdocs/
          # Preserve hosted data even if the old repository-wide sync tracked it.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            backend/
            backend/**
            **/storage/
            **/storage/**
            **/*.log

      # The sync cache can skip .env even if it was removed from the server.
      - name: Upload production environment
        run: |
          curl --fail --silent --show-error --ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file .env "ftp://$FTP_SERVER/htdocs/.env"
