name: Contracts

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none

      - name: Lint changed PHP
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff -z --name-only --diff-filter=ACM FETCH_HEAD HEAD -- '*.php' \
            | xargs -0 -r -n1 -P4 php -l

      - name: Smoke and view checks
        run: npm run check

      - name: Deterministic contracts
        run: npm run check:contracts
