<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: superadmin-radar-resolution.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epunda+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-sidebar region chrome" data-region="sidebar"><!-- fixed Control Navy role navigation rail --></div>
  <div class="r-global-toolbar region chrome" data-region="global-toolbar"><!-- fixed search and notification toolbar --></div>
  <div class="r-page-heading region text" data-region="page-heading"><!-- Platform Control Center heading and operating instruction --><p style="font-size:var(--r-page-heading-font);font-family:var(--r-page-heading-family),sans-serif;font-weight:var(--r-page-heading-weight);line-height:1.05;margin:0">page-heading</p></div>
  <div class="r-freshness-controls region control" data-region="freshness-controls"><!-- updated timestamp and dashboard refresh control: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop freshness-controls); a control need not have button chrome --></div>
  <div class="r-risk-horizon region chrome" data-region="risk-horizon"><!-- four-part platform risk horizon ledger --></div>
  <div class="r-horizon-critical region control" data-region="horizon-critical"><!-- critical condition count and severity signal: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop horizon-critical); a control need not have button chrome --></div>
  <div class="r-horizon-warning region control" data-region="horizon-warning"><!-- warning condition count and severity signal: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop horizon-warning); a control need not have button chrome --></div>
  <div class="r-horizon-backup region control" data-region="horizon-backup"><!-- latest backup readiness signal: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop horizon-backup); a control need not have button chrome --></div>
  <div class="r-horizon-access region control" data-region="horizon-access"><!-- privileged access setup readiness signal: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop horizon-access); a control need not have button chrome --></div>
  <div class="r-issue-queue region chrome" data-region="issue-queue"><!-- severity-ranked platform issue queue --></div>
  <div class="r-issue-queue-title region text" data-region="issue-queue-title"><!-- platform issue queue heading and count --><p style="font-size:var(--r-issue-queue-title-font);line-height:1.05;margin:0">issue-queue-title</p></div>
  <div class="r-issue-row-primary region control" data-region="issue-row-primary"><!-- selected highest-severity issue row: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop issue-row-primary); a control need not have button chrome --></div>
  <div class="r-issue-row-secondary region control" data-region="issue-row-secondary"><!-- secondary platform issue row: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop issue-row-secondary); a control need not have button chrome --></div>
  <div class="r-issue-row-tertiary region control" data-region="issue-row-tertiary"><!-- tertiary platform issue row: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop issue-row-tertiary); a control need not have button chrome --></div>
  <div class="r-resolution-workbench region chrome" data-region="resolution-workbench"><!-- persistent guided resolution workbench --></div>
  <div class="r-resolution-title region text" data-region="resolution-title"><!-- selected issue title severity and category --><p style="font-size:var(--r-resolution-title-font);line-height:1.05;margin:0">resolution-title</p></div>
  <div class="r-resolution-description region text" data-region="resolution-description"><!-- selected issue explanation and context --><p style="font-size:var(--r-resolution-description-font);line-height:1.05;margin:0">resolution-description</p></div>
  <div class="r-resolution-step-one region control" data-region="resolution-step-one"><!-- first inspect-signal runbook step: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop resolution-step-one); a control need not have button chrome --></div>
  <div class="r-resolution-step-two region control" data-region="resolution-step-two"><!-- second open-control runbook step: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop resolution-step-two); a control need not have button chrome --></div>
  <div class="r-resolution-step-three region control" data-region="resolution-step-three"><!-- third verify-recovery runbook step: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop resolution-step-three); a control need not have button chrome --></div>
  <div class="r-readiness-ledger region chrome" data-region="readiness-ledger"><!-- platform recovery and continuity readiness ledger --></div>
  <div class="r-readiness-title region text" data-region="readiness-title"><!-- platform readiness ledger heading and explanation --><p style="font-size:var(--r-readiness-title-font);line-height:1.05;margin:0">readiness-title</p></div>
  <div class="r-readiness-access region control" data-region="readiness-access"><!-- privileged access readiness destination: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop readiness-access); a control need not have button chrome --></div>
  <div class="r-readiness-continuity region control" data-region="readiness-continuity"><!-- Store continuity readiness destination: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop readiness-continuity); a control need not have button chrome --></div>
</main>
</body>
</html>
